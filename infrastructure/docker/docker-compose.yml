services:
  postgres:
    image: postgres:16-alpine
    container_name: talkive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: talkive
    ports:
      - "5432:5432"
    volumes:
      - talkive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talkive"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talkive-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - talkive_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: talkive-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    ports:
      - "7880:7880" # WebRTC signaling & HTTP API
      - "7881:7881" # WebRTC TCP fallback
      - "50000-50100:50000-50100/udp" # WebRTC UDP media traffic
    depends_on:
      redis:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: talkive-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - talkive_miniodata:/data

volumes:
  talkive_pgdata:
  talkive_redisdata:
  talkive_miniodata:
